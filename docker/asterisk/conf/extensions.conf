; Dialplan mínimo: toda ligação é entregue ao worker do CRM (app Stasis
; "crm"). Nenhuma extensão aqui disca para fora — quem liga para a
; operadora é o worker, e só com uma voice_calls criada pela API.
[general]
static=yes
writeprotect=yes

[de-tronco]
exten => _[+0-9a-zA-Z].,1,Stasis(crm,entrada)
 same => n,Hangup()
exten => s,1,Stasis(crm,entrada)
 same => n,Hangup()

[de-ramal]
exten => _[+0-9a-zA-Z].,1,Stasis(crm,saida)
 same => n,Hangup()
