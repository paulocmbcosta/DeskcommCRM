; Troncos e ramais vivem na MEMÓRIA, empurrados pelo worker pela ARI
; (PUT /ari/asterisk/config/dynamic/res_pjsip/...). O pjsip.conf só tem os
; transportes. Asterisk reiniciado = memória vazia = o worker sincroniza de novo.
[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=memory
auth=config,pjsip.conf,criteria=type=auth
auth=memory
aor=config,pjsip.conf,criteria=type=aor
aor=memory
registration=config,pjsip.conf,criteria=type=registration
registration=memory

[res_pjsip_endpoint_identifier_ip]
identify=config,pjsip.conf,criteria=type=identify
identify=memory
