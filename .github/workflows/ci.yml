name: ci

on:
  pull_request:
    paths-ignore:
      # Mudança só de prosa não pode quebrar código, e o ciclo completo custa
      # ~150 minutos faturados. Medido na branch de Times: 13 dos 46 commits
      # tocaram SÓ documentação — 28% do trabalho, pago integralmente.
      #
      # ⚠️ ARMADILHA CONHECIDA: `paths-ignore` num check OBRIGATÓRIO de branch
      # protection faz o PR nunca receber aquele check e ficar travado para
      # sempre. Hoje este repositório não tem branch protection (plano Free não
      # oferece em repo privado). Se um dia tiver, este bloco tem de sair ou
      # virar um job que reporta sucesso de propósito.
      - "docs/**"
      - "**/*.md"
      - ".changes/**"
  push:
    branches: [main]
    paths-ignore:
      # Mudança só de prosa não pode quebrar código, e o ciclo completo custa
      # ~150 minutos faturados. Medido na branch de Times: 13 dos 46 commits
      # tocaram SÓ documentação — 28% do trabalho, pago integralmente.
      #
      # ⚠️ ARMADILHA CONHECIDA: `paths-ignore` num check OBRIGATÓRIO de branch
      # protection faz o PR nunca receber aquele check e ficar travado para
      # sempre. Hoje este repositório não tem branch protection (plano Free não
      # oferece em repo privado). Se um dia tiver, este bloco tem de sair ou
      # virar um job que reporta sucesso de propósito.
      - "docs/**"
      - "**/*.md"
      - ".changes/**"

# O GITHUB_TOKEN destes jobs serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público) —
# `contents: read` cobre os dois, que é o escopo que o próprio modelo de dados do
# CodeQL prescreve para essas duas actions. O `cache: pnpm` NÃO usa este token
# (usa ACTIONS_RUNTIME_TOKEN), `pnpm/action-setup` não tem input de token, e
# nenhum passo `run:` enxerga o token — ele só entra no ambiente via
# `secrets.GITHUB_TOKEN`, que não aparece em nenhum destes workflows.
#
# No topo, e não por job, porque os dois jobs precisam do mesmo escopo e job
# acrescentado depois nasce restrito em vez de herdar o default do repositório.
# Esse default hoje é `read` (medido em actions/permissions/workflow), então isto
# não corrige vazamento em vigor: tira a garantia de uma configuração que muda
# fora do repo, num clique, sem PR e sem deixar rastro aqui. `packages: write`
# continua por job em publish-image.yml — mesma regra, menor escopo que precisa.
# Rodada obsoleta não se paga. Sem isto, cada push no PR começa um ciclo novo e
# DEIXA o anterior correr até o fim — 75 minutos de `e2e` para produzir um
# resultado que já nasceu velho. Medido nesta conta em setembro de 2026: a branch
# de Times gerou 8 rodadas de `ci` e 8 de `e2e`, sete de cada obsoletas, e a cota
# de 2.000 minutos do plano Free acabou em 1.751.
#
# `cancel-in-progress` só para PULL REQUEST, nunca para `push` na main: cancelar
# uma rodada da main interromperia a publicação de imagem de uma versão real,
# deixando o cliente com uma tag que aponta para nada.
#
# Isto NÃO reduz cobertura: o ciclo completo continua rodando no commit que
# importa, que é o último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ⚠️ O teto e o heap abaixo são declarados em
  # `tests/unit/preambulo-do-ci-nao-come-o-relogio.test.ts` (const TETOS), que é
  # onde a RAZÃO fica registrada e revisada. Mudar um sem o outro reprova.
  #
  # A linha `timeout-minutes` tem de ficar nos primeiros 400 caracteres depois do
  # nome do job: é a janela que aquele gate lê. Comentário longo vai ACIMA da
  # chave do job, nunca entre ela e o teto — senão o gate deixa de ENCONTRAR o
  # número e reprova por não medir, que é pior que reprovar por medir.
  # 45 e não 15 pela MESMA razão do teto de heap logo abaixo: runner de
  # repositório privado tem metade dos núcleos do público, e esta suíte tem
  # 9.347 casos.
  #
  # O teto de 15 nunca foi atingido antes porque o job morria ANTES de chegar
  # aos testes: o Typecheck abortava por falta de memória. Medido nesta
  # rodada, com o heap já corrigido: Typecheck, Lint, Channel leak e Role rank
  # passaram, e `Unit tests` foi cortado aos 15min19s — o segundo gargalo
  # estava escondido atrás do primeiro.
  #
  # Se voltar a estourar, a resposta é dividir a suíte em partes paralelas
  # (como o `e2e` já faz), não subir o número de novo sem medir.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      # O teto de heap é EXPLÍCITO porque o padrão do Node não serve aqui, e a
      # razão não é o código: runner de repositório PÚBLICO tem 16 GB, o de
      # repositório PRIVADO tem 7 GB, e o Node dimensiona o heap a partir da RAM
      # da máquina. O mesmo `tsc` que passa no upstream público aborta num fork
      # privado com `FATAL ERROR: Ineffective mark-compacts near heap limit` e
      # exit 134 — medido na main deste fork em 2026-09-16, antes de qualquer
      # feature: `invariants` verde e `verify` vermelho pelo estouro.
      #
      # 5 GB deixa folga para o SO e para o pnpm nos 7 GB disponíveis. Se um dia
      # voltar a abortar, o número sobe junto com a evidência — não se troca por
      # `--no-check` nem se remove o passo.
      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=5120

      - name: Lint
        run: pnpm lint

      # Invariante 1 de docs/doctrine/restricao-de-canal.md: nenhuma feature
      # nomeia um provider. Step próprio (e não só dentro de `gov:verify`)
      # porque é o CI que gateia PR — `gov:verify` não é invocado por nenhum
      # workflow, e mecanismo que não roda no gate não protege nada.
      - name: Channel provider leak
        run: pnpm lint:channels

      # Auditoria de autorização e papel: impede comparações diretas de papel
      # fora de lib/auth/ que contornem o gate de MFA e requireRole().
      - name: Role rank audit
        run: pnpm lint:role-rank

      - name: Unit tests
        run: pnpm test:unit


      # Scripts do kit self-host num repo git descartável (docker/crontab
      # dublados). É o único gate que exercita o update.sh — um erro aqui
      # rebobina a instalação de quem hospeda, e nenhum teste TS o veria.
      #
      # Desde 2026-08-08 inclui `hostgator-setup-kit/test-validators.sh`, os 163
      # casos que cobrem o install.sh. Eles existiam e NÃO rodavam em job nenhum
      # (issue #191): dois defeitos que tornavam a instalação impossível —
      # escolher OpenRouter travava o instalador num laço, escolher OpenAI
      # deixava o .env pela metade — passaram por todos os checks verdes. 15s.
      - name: Kit self-host (bash)
        run: pnpm test:shell

  # Gate de isolamento multi-tenant + invariantes de governança.
  # Job separado de propósito: roda em paralelo ao verify (não atrasa o feedback
  # rápido) e vira um check nomeado, que é o que a doutrina de RLS exige provar.
  # scripts/test-db.sh sobe pgvector/pgvector:pg17, aplica supabase/baseline.sql
  # em modo install (ON_ERROR_STOP=1) e update (idempotência), e roda
  # tests/invariants/** contra ele. Invocar via `pnpm test:db` é o que põe
  # node_modules/.bin no PATH que o script herda para chamar `vitest`.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: RLS isolation + governance invariants
        run: pnpm test:db
