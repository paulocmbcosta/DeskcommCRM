name: perf

# O build de produção roda UMA VEZ POR VERSÃO, no PR de release — e por
# `Run workflow`, em qualquer branch (`gh workflow run perf.yml --ref <branch>`).
# Em PR comum o job fica PULADO, e no `push` da `main` este arquivo não dispara
# mais. A medição, a razão e o que se perde estão no cabeçalho do ci.yml.
#
# Condição de job, e não filtro no gatilho: `build-and-size` é check obrigatório
# da `main`, e check obrigatório que NÃO REPORTA trava o PR para sempre. Job
# pulado por `if:` reporta `skipped`, que a proteção lê como satisfeito. A
# condição está presa, por inteiro, em
# `tests/unit/gatilho-dos-jobs-de-entrega.test.ts`.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# O GITHUB_TOKEN deste job serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público).
# `pnpm build` é local e o relatório de tamanho é escrita em arquivo do runner
# (`>> $GITHUB_STEP_SUMMARY`), sem token. Ver o comentário em ci.yml para o
# porquê de o bloco ficar no topo.
# Rodada obsoleta não se paga. Sem isto, cada push no PR começa um ciclo novo e
# DEIXA o anterior correr até o fim — 75 minutos de `e2e` para produzir um
# resultado que já nasceu velho. Medido nesta conta em setembro de 2026: a branch
# de Times gerou 8 rodadas de `ci` e 8 de `e2e`, sete de cada obsoletas, e a cota
# de 2.000 minutos do plano Free acabou em 1.751.
#
# `cancel-in-progress` só para PULL REQUEST: uma rodada manual (`Run workflow`)
# foi pedida por alguém e corre até o fim.
#
# Isto NÃO reduz cobertura: o ciclo continua rodando no commit que importa, que
# é o último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-size:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # "off", não vazio: vazio seleciona o Sentry DA COMUNIDADE
          # (lib/sentry/dsn.ts:8-10). A intenção aqui sempre foi desligar, e
          # com aspas vazias ela não era alcançada — o build seguia com o DSN
          # padrão embutido.
          SENTRY_DSN: "off"

      - name: Report bundle sizes
        run: |
          {
            echo "## Build output sizes"
            du -sh .next 2>/dev/null || true
            if [ -d .next/static ]; then du -sh .next/static; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: Lighthouse CI + bundle-analyzer thresholds deferred (S-12.05 follow-up).
